<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Estado de mi pedido — pandora.dup</title>
  <link rel="icon" type="image/png" href="assets/images/branding/pandora-symbol.png?v=1">
  <link rel="apple-touch-icon" href="assets/images/branding/pandora-symbol.png?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/account.css?v=20261025-1">
</head>
<body>
  <header class="account-header">
    <a href="index.html" class="account-brand" aria-label="Pandora Dup"><span class="account-brand-logo"></span></a>
    <a href="index.html">VOLVER A LA TIENDA</a>
  </header>

  <main class="account-main">
    <section class="auth-card" aria-labelledby="tracking-title">
      <p class="eyebrow">MIS PEDIDOS</p>
      <h1 id="tracking-title">Estado de mi pedido</h1>
      <p class="tracking-help" id="tracking-help">Ingresá el número que aparece en tu comprobante. No necesitás una cuenta.</p>
      <form data-tracking-form>
        <label for="order-number">Número de pedido</label>
        <input id="order-number" name="orderNumber" type="text" required maxlength="8" pattern="[A-Fa-f0-9]{8}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="tracking-help" placeholder="Ej.: A1B2C3D4">
        <button class="submit-button" type="submit">CONSULTAR PEDIDO</button>
        <p class="form-message" data-tracking-message role="status" aria-live="polite"></p>
      </form>
      <div class="tracking-result hidden" data-tracking-result role="status" aria-live="polite">
        <p class="eyebrow" data-tracking-number></p>
        <h2 data-tracking-status></h2>
        <p data-tracking-description></p>
      </div>
      <a class="tracking-admin-link" href="admin.html">Acceso de administración →</a>
    </section>
  </main>

  <script type="module" src="assets/js/account.js?v=20261025-1"></script>
</body>
</html>
